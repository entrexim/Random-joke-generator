<!DOCTYPE html>

  <title>Random Joke Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: black;
    }
    #joke {
      margin: 20px;
      font-size: 1.5rem;
      color: #555;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;

    .joke-part{
        z-index: 10;
    }
    .main{
      margin-top: -70px;
        display: flex;
        z-index: -100;
        width: 100%;


    }
    .animate {
       height: 0px;
        width: 0px;
        background-color: rgb(255, 255, 255);
        box-shadow: 0px 0px 10px 1px rgb(255, 255, 255);
        margin: 20px;
        animation: animate 5s linear 1;
        animation-duration: calc(10s/var(--i));
    }
  
    
    .joke-part{
      margin-top: 150px;
    }
    .joke-part2{
      margin-top: 100px;
    }
    @keyframes animate {
        0%{
            transform: translateY(-10vh);


        }
        100%{
            transform: translateY(100vh) ;
        }
        
    }

  </style>
</head>
